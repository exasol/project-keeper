name: Verify GPG Signing

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify-gpg-signing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up JDK and GPG key
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Sign artifacts without publishing
        run: >
          mvn --batch-mode --no-transfer-progress
          -Dgpg.skip=false
          -DskipTests -DskipITs -DossindexSkip=true
          verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Verify signatures
        run: |
          find . -path '*/target/*.asc' -type f -print
          find . -path '*/target/*.asc' -type f -exec sh -c \
            'gpg --verify "$1" "${1%.asc}"' _ {} \;
