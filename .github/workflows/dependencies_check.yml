# This file was generated by Project Keeper.
name: Check Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "42 22 * * 0"

jobs:
  check_dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: "bash"
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-check_dependencies
      cancel-in-progress: true
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - 
        name: Set up JDKs
        id: setup-jdks
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: |-
            17
            21
          cache: "maven"
          server-id: ossindex
          server-username-env-var: OSSINDEX_USERNAME
          server-password-env-var: OSSINDEX_API_TOKEN
      - name: Install Project Keeper
        id: install-project-keeper
        run: |
          ./mvnw --batch-mode --threads 1C install \
              -Dmaven.test.skip=true -Dproject-keeper.skip=true \
              -DossindexSkip=true -Dmaven.javadoc.skip=true \
              -Derror-code-crawler.skip=true -Dreproducible.skip=true
      - 
        name: Prepare Maven Wrapper
        id: prepare-maven-wrapper
        run: MVNW_VERBOSE=true ./mvnw -version
      - 
        name: Generate ossindex report
        id: ossindex-report
        run: |
          ./mvnw --batch-mode org.sonatype.ossindex.maven:ossindex-maven-plugin:audit \
              org.sonatype.ossindex.maven:ossindex-maven-plugin:audit-aggregate \
              -Dossindex.reportFile=$(pwd)/ossindex-report.json \
              -Dossindex.fail=true
        env:
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_API_TOKEN: ${{ secrets.OSSINDEX_API_TOKEN }}
      - 
        name: Upload OSS Index report
        id: upload-ossindex-report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ossindex-report
          path: ossindex-report.json
          retention-days: 5
          if-no-files-found: ignore
          archive: true
